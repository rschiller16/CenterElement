<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="blue-rectangle">
    <div class="yellow-rectangle"></div>
</div>
  <style>
        .blue-rectangle {
            position: relative;
            width: 600px;
            height: 400px;
            background-color: #5fdbfa;
            border: 4px solid black;
        }

        .yellow-rectangle {
            position: absolute;
            width: 300px;
            height: 200px;
            top: 50%;
            left: 50%;
            margin-top: -100px;
            margin-left: -150px;
            background-color: #e6f516;
            border: 4px solid black;
        }
    </style>
</body>
</html>
